name: Deploy Static Build

on:
  push:
    branches: [ Master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Inject Secret into config.js
        run: |
          echo "window.RUNTIME_CONFIG = { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' };" > config.js

      - name: Commit and push generated config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "chore: dynamically inject runtime config secret" || echo "No changes to commit"
          git push