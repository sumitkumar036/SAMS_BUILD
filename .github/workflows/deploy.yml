name: Build and Deploy

on:
  push:
    branches: [ Master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Inject GitHub Secret into Runtime Config
        run: |
          echo "window.RUNTIME_CONFIG = { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' };" > public/config.js

      - name: Build project
        run: npm run build